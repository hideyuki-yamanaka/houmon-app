name: Weekly notify

# 毎週 日曜 20:00 JST (= 11:00 UTC) に実行
# 全チームに「今週の進捗サマリー」プッシュ通知を送る
on:
  schedule:
    - cron: '0 11 * * 0'
  workflow_dispatch: # 手動実行も可

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekly notify endpoint
        run: |
          curl -fsS -X POST \
            -H "X-Cron-Secret: ${{ secrets.NOTIFY_CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            https://houmon-app-lilac.vercel.app/api/notify/weekly
